# Documentation site for Ops Toolbox: MkDocs with the Material theme.
# Build and preview commands are in docs/requirements.txt and
# docs/contributing/development.md; hosting is in docs/contributing/deployment.md.
site_name: Ops Toolbox
site_description: >-
  Standalone helper scripts for workstations, servers, Git repositories,
  MikroTik RouterOS devices and GKE clusters. Report first, preview, then apply.
site_url: https://ops.szolotov.com/
repo_url: https://github.com/greenblacked/ops-toolbox
repo_name: greenblacked/ops-toolbox
edit_uri: edit/master/docs/
# The Credits link is not here: Material prints this string as-is, so a
# relative href would break below the top level. overrides/partials/
# copyright.html appends it with the url filter, which resolves per page.
copyright: >-
  <a href="https://github.com/greenblacked/ops-toolbox/blob/master/LICENSE">MIT License</a>
  &middot; Built with <a href="https://www.mkdocs.org/">MkDocs</a> and
  <a href="https://squidfunk.github.io/mkdocs-material/">Material for MkDocs</a>
docs_dir: docs

# Files in docs/ that are not pages. The hook script lives beside the pages
# only so the repository's README-per-package check can find its README.
exclude_docs: |
  hooks/
  assets/fonts/README.md
  stylesheets/theme/README.md
  requirements.txt

hooks:
  - docs/hooks/repo_files.py

theme:
  name: material
  language: en
  # The fonts are self-hosted (docs/assets/fonts/, @font-face in
  # docs/stylesheets/theme/rpt-theme.css), so Material must not fetch Google
  # Fonts.
  font: false
  palette:
    # No "(prefers-color-scheme)" entry and no media queries: Material then
    # uses the first entry (dark) for every visitor, and the toggle switches
    # to light. An auto entry first would follow the visitor's system instead.
    # primary and accent are "custom": the colours come from the --rpt-*
    # tokens in docs/stylesheets/theme/rpt-theme.css (graphite surfaces, report
    # blue).
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  # navigation.expand is left out on purpose: with navigation.sections it
  # would open every group in the sidebar at once, and the Platforms and
  # Contributing groups are long enough to bury the current page.
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow
  # Brand mark (docs/assets/images/): the logo is the full graphite tile so it
  # reads on both the dark and the light header; favicon.svg is the same tile
  # without the logo's hairline border. overrides/main.html adds the PNG
  # fallbacks and the apple-touch-icon.
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github

# The portable theme loads first; extra.css holds only this site's tweaks.
extra_css:
  - stylesheets/theme/rpt-theme.css
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/greenblacked/ops-toolbox
      name: Ops Toolbox on GitHub

plugins:
  # The separator splits search terms at underscores, slashes, dots (not
  # inside version numbers), brackets and camelCase as well as at spaces and
  # hyphens, so disk_cleanup.sh, linux/status.sh, --dry-run and TgBotToken are
  # found by any part of their name. The query is split the same way.
  - search:
      separator: '[\s\-_,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: date

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  # Runbook checklists: "- [ ] Step" renders a checkbox that toggles even
  # without JavaScript; overrides/assets/javascripts/rpt-checklist.js names
  # each box, saves its state in the browser and adds the progress line.
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quick-start.md
      - Philosophy: getting-started/philosophy.md
      - Installation & Usage: getting-started/usage.md
  - Platforms:
      - macOS: platforms/macos.md
      - Linux: platforms/linux.md
      - Windows: platforms/windows.md
      - Git: platforms/git.md
      - MikroTik: platforms/mikrotik.md
      - RouterOS compatibility: platforms/routeros-compatibility.md
      - Kubernetes: platforms/kubernetes.md
      - Dotfiles: platforms/dotfiles.md
  - Scripts:
      - Overview: scripts/index.md
  - Runbooks:
      - Overview: runbooks/index.md
      - Linux low on disk: runbooks/linux-low-disk.md
      - Kubernetes unhealthy pods: runbooks/kubernetes-unhealthy-pods.md
      - TLS certificate expiring: runbooks/tls-certificate-expiring.md
      - Git Permission denied (publickey): runbooks/git-permission-denied-publickey.md
      - Linux network unreachable: runbooks/linux-network-unreachable.md
      - Undo the last Git commit: runbooks/git-undo-last-commit.md
      - Windows low on disk: runbooks/windows-low-disk.md
      - WSL disk keeps growing: runbooks/wsl-disk-growing.md
      - Linux inotify watch limit: runbooks/linux-inotify-watch-limit.md
      - Git commit signing fails: runbooks/git-commit-signing-fails.md
  - Contributing:
      - Contributing: contributing.md
      - Development: contributing/development.md
      - Testing: contributing/testing.md
      - Deployment: contributing/deployment.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
  - Credits: credits.md
