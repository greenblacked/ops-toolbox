extends: default

# yamllint only discovers *.yml and *.yaml on its own, so windows/setup's
# configuration.winget - which is YAML - was linted by nothing. Naming the
# extensions here means `yamllint .` covers it for CI and by hand alike.
# Overriding this key replaces the default list, so the defaults are repeated.
yaml-files:
  - '*.yaml'
  - '*.yml'
  - '.yamllint'
  - '*.winget'

# Honour .gitignore, so `yamllint .` sees the same files here as in CI's clean
# checkout. Without it an ignored directory - a coding tool's worktree copies,
# say - is walked too, and a local run can fail on a file that is not in the
# tree it claims to lint.
ignore-from-file: .gitignore

rules:
  document-start: disable
  line-length: disable
  truthy:
    allowed-values:
      - 'true'
      - 'false'
    check-keys: false
