version: 2

# The workflows pin every action to a commit SHA rather than a moving tag,
# because a tag is mutable and a SHA is what actually runs. A SHA pin with no
# update mechanism just rots, so this is the other half of that decision:
# Dependabot re-resolves the tags monthly and opens one grouped pull request,
# with the new version in the trailing comment it maintains for us.
#
# Pull requests land on master, which is where CI's `pull_request` trigger
# points, so they get the full gate like any other change.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  # Every suite that runs anything builds it on a base image, and those were
  # watched by nothing. The argument is the one the block above makes for
  # actions: a floating tag is mutable, so `alpine:3.21.3` today is not
  # necessarily the same bytes next month, and an unwatched base image drifts
  # until something breaks or a CVE lands in it.
  #
  # `directories` globs rather than listing, for the reason the README drift
  # check gives for discovering packages: a hardcoded list is the thing that
  # rots. A Dockerfile added later is covered by the commit that adds it.
  #
  # Coverage is real but partial, and worth knowing rather than assuming:
  # Dependabot updates version-like tags, so alpine, python, ruby and golang
  # move, while `debian:bookworm-slim` is a codename with no version to
  # compare and stays put. `linux/tests/tester` takes its base from a
  # ${BASE_IMAGE} build argument, so there is no literal for Dependabot to
  # read at all - that one is the linux matrix's business, set in ci.yml.
  - package-ecosystem: docker
    directories:
      - '/**/*'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - '*'
