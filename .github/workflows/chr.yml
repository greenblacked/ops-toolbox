name: RouterOS CHR

# The RouterOS integration suite boots a real CHR image under QEMU, which takes
# minutes rather than seconds. It runs nightly, on demand, on the pull requests
# that touch mikrotik/, and on pushes that touch the CHR image or the version
# pin - a narrow enough set that the cost lands only where a real router is the
# one thing that can answer the question.
# The version is pinned in mikrotik/tests/routeros-version.env and is deliberately
# not repeated here: GITHUB_TOKEN cannot push changes to .github/workflows, so a
# version named in this file blocks the automated bump from opening its branch.
#
# Two things worth knowing if this starts looking flaky:
#   - The CHR image is downloaded from download.mikrotik.com at build time, so a
#     failure here is as likely to be their CDN as our scripts. Check the build
#     step before the test output.
#   - GitHub disables scheduled workflows in a repository with no activity for
#     60 days, and does not run them in forks at all.

on:
  # Two development-path triggers, because they cover different gaps and each
  # one is sometimes the only thing that fires.
  #
  # A pull request touching mikrotik/ gets a run, because the nightly cannot
  # answer "does this change work" - by the time it fires the change has
  # usually merged. This is also the trigger that tests the merge result rather
  # than the branch tip.
  #
  # A push touching the CHR image, compose files or the version pin gets a run
  # even with no pull request open, which is the state ci.yml deliberately does
  # not cover. Those paths rebuild the QEMU image, and the ordinary PR path
  # only hadolints the Dockerfile.
  #
  # They overlap: a pull-request branch touching mikrotik/tests/chr/** fires
  # both, in different concurrency groups, so that one case boots CHR twice.
  # Left as it is rather than quietly dropping either - the alternative is
  # narrowing somebody else's trigger to save a job on an uncommon path.
  #
  # The branch list mirrors ci.yml's, and for the reason stated there: these
  # are *target* branches, and a target matching no pattern runs nothing and
  # merges green.
  pull_request:
    branches:
      - master
      - 'feat/**'
      - 'feature/**'
      - 'ci/**'
      - 'chore/**'
      - 'fix/**'
    paths:
      - 'mikrotik/**'
      - 'run-tests.sh'
      - '.github/workflows/chr.yml'
  push:
    paths:
      - 'mikrotik/tests/chr/**'
      - 'mikrotik/tests/docker-compose.yml'
      - 'mikrotik/tests/docker-compose.kvm.yml'
      - 'mikrotik/tests/run.sh'
      - 'mikrotik/tests/routeros-version.env'
      - '.github/workflows/chr.yml'
  schedule:
    # 03:37 UTC daily. The odd minute is deliberate: GitHub queues scheduled
    # workflows and the top of the hour is heavily contended, so '0 3 * * *'
    # was landing between 05:44 and 06:21 — up to three hours late, and under
    # enough load a run is dropped rather than merely delayed. An off-round
    # minute competes with far less and lands close to the requested time.
    - cron: '37 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chr-${{ github.event.pull_request.number || github.ref }}
  # A superseded pull-request push should not leave a 45-minute QEMU boot
  # running to a verdict about code that has been replaced. Nightly and manual
  # runs are never cancelled: each one is the only verdict for that day.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  routeros-integration:
    name: Test / RouterOS integration
    # Pinned rather than ubuntu-latest: this job depends on the runner exposing
    # /dev/kvm and on a QEMU new enough to boot CHR, and an image rollover is
    # not something anyone wants to discover from a 45-minute nightly timeout.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # /dev/kvm exists on ubuntu-24.04, and until this step was added that was
      # all anyone checked. It is crw-rw---- root:kvm and the runner user is not
      # in that group, so run.sh's readable-and-writable test failed, the
      # docker-compose.kvm.yml overlay was never layered on, and CHR booted
      # under TCG - silently, because the suite still passes that way, roughly
      # ten times slower. Widening the mode on an ephemeral runner is the
      # documented way to hand the device to a container.
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm on this runner — CHR will boot under TCG emulation"
          fi

      - name: Run RouterOS CHR suite
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/mikrotik.log"
          # `shell: bash` runs with -e, which would abort the step on a failing
          # suite before the summary is written. Take the exit code by hand.
          set +e
          ./run-tests.sh mikrotik 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          # run-tests.sh already prints a pass/fail/skip matrix; lift it into
          # the run summary. This one matters more than most: nobody is watching
          # a 03:00 run, and the failure notification links here.
          summary="$(awk '/^=== summary ===$/{p=1} p' "$log")"
          [ -n "$summary" ] || summary="$(tail -n 20 "$log")"
          {
            printf '### `run-tests.sh mikrotik`\n\n'
            printf '```text\n%s\n```\n\n' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
