name: CI

on:
  push: {}
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yamllint

      # The Git Bash dotfiles have no .sh extension, so a plain '*.sh' glob has
      # never covered them. They are real bash and they pass, so list them.
      # ShellCheck needs --shell=bash for them: with no shebang it cannot detect
      # the dialect and SC2148 fires at error severity.
      - name: Check Bash syntax
        shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh' \
            'windows/git-bash/.bashrc' \
            'windows/git-bash/.bash_profile' \
            'windows/git-bash/.aliases' \
            'windows/git-bash/default-git-bash/.bashrc' \
            'windows/git-bash/default-git-bash/.bash_profile' \
            'windows/git-bash/default-git-bash/.aliases')
          printf 'checking %d files\n' "${#scripts[@]}"
          bash -n "${scripts[@]}"

      # -x follows `source` directives, matching what the Docker suites already
      # do. Without it, sourced files are invisible to the analysis.
      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh' \
            'windows/git-bash/.bashrc' \
            'windows/git-bash/.bash_profile' \
            'windows/git-bash/.aliases' \
            'windows/git-bash/default-git-bash/.bashrc' \
            'windows/git-bash/default-git-bash/.bash_profile' \
            'windows/git-bash/default-git-bash/.aliases')
          shellcheck --severity=error -x --shell=bash "${scripts[@]}"

      # Pinned for the same reason the CHR image, ruff's target-version and the
      # tester images are pinned: an analyzer release should not turn a green
      # repository red on someone else's schedule.
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $files = git ls-files '*.ps1' '*.psm1'
          if (-not $files) { Write-Host 'no PowerShell files'; exit 0 }
          $found = @()
          foreach ($f in $files) {
            $found += Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($found.Count) {
            $found | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
            exit 1
          }
          Write-Host ('PSScriptAnalyzer clean over {0} files' -f $files.Count)

      - name: Lint YAML
        run: yamllint --config-file .yamllint.yml .

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: .markdownlint-cli2.yaml
          globs: '**/*.md'

  # Suites go through run-tests.sh rather than calling each tests/run.sh
  # directly, so the aggregator is exercised by CI too and "it passed locally"
  # and "it passed in CI" mean the same thing. Matrix values are run-tests.sh
  # suite names, not directory names.
  test:
    name: Test / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - git
          - macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run ${{ matrix.suite }} suite
        run: ./run-tests.sh ${{ matrix.suite }}

  python:
    name: Test / python helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # 3.9 is what /usr/bin/python3 provides on macOS, and it is the
      # interpreter stay_fresh.sh invokes lib/workspace_scan.py with. Testing on
      # anything newer would let 3.10+ syntax through and break on the machines
      # these scripts target.
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # test-env/python/run.sh reports ruff as "skipped" and still exits 0 when
      # it is absent, so without this step the lint silently never ran.
      - name: Install ruff
        run: pipx install ruff==0.15.8

      - name: Run python suite
        run: ./run-tests.sh python
