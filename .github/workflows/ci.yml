name: CI

# Triggers follow the repository's typed-branch convention — feat/, ci/,
# chore/, fix/ — and are arranged so a change is built once rather than twice.
#
# `push` was previously unfiltered, so a branch with an open pull request ran
# the whole matrix on the push event and then again on the pull_request event.
# Each event now owns one path: `pull_request` covers development branches (and
# tests the *merge result*, which a branch push cannot), and `push` covers only
# master, where there is no pull request to do it.
#
# The tradeoff, stated plainly: a typed branch with no pull request open gets no
# CI. Open the PR as a draft, or use `workflow_dispatch` (Actions -> CI -> Run
# workflow) if you want a verdict before review.
on:
  push:
    branches:
      - master
  pull_request:
    # These are *target* branches, not source branches. master is the ordinary
    # case; the typed prefixes are listed so a stacked pull request onto another
    # feature branch is checked too, instead of silently running nothing.
    branches:
      - master
      # feat/, not feature/ — the convention changed after this list was
      # written, so a pull request stacked onto a feat/ branch matched nothing
      # and ran no checks at all. A target branch that matches no pattern does
      # not fail the pull request; it merges green because nothing ever ran,
      # which is the worst way for a filter to be wrong. feature/ is kept so
      # the older prefix does not silently lose coverage either.
      - 'feat/**'
      - 'feature/**'
      - 'ci/**'
      - 'chore/**'
      - 'fix/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull-request pushes are worth cancelling. Runs on master are not:
  # every commit that lands on the default branch should get its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every external tool this workflow installs is pinned, for the same reason the
# CHR image, ruff's target-version and the tester images are: a release on
# somebody else's schedule should not turn a green repository red. Bumping one
# of these is a deliberate commit with a test run behind it.
#
# The GitHub Actions used below are pinned to commit SHAs rather than moving
# tags, with the tag in a trailing comment. A tag is mutable; a SHA is what
# actually gets executed. .github/dependabot.yml keeps them current.
env:
  SHELLCHECK_VERSION: '0.10.0'
  ACTIONLINT_VERSION: '1.7.12'
  HADOLINT_VERSION: '2.15.1'
  KUBECONFORM_VERSION: '0.8.0'
  YAMLLINT_VERSION: '1.38.0'
  RUFF_VERSION: '0.15.8'
  PSSA_VERSION: '1.23.0'

jobs:
  # Which parts of the repository a change actually touches.
  #
  # Every output below is consumed by a *step-level* `if`, never a job-level
  # one. That is deliberate: a job skipped at the job level reports "skipped"
  # rather than "success", and a required status check that never reports leaves
  # a pull request unmergeable forever. Skipping at the step level keeps every
  # job name reporting green with no branch-protection changes needed, at the
  # cost of ~20s of runner start-up for a job with nothing to do. The saving
  # this buys is the part that matters: a README-only change no longer builds
  # and boots the Docker suites.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      powershell: ${{ steps.filter.outputs.powershell }}
      markdown: ${{ steps.filter.outputs.markdown }}
      yaml: ${{ steps.filter.outputs.yaml }}
      python: ${{ steps.filter.outputs.python }}
      workflow: ${{ steps.filter.outputs.workflow }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      manifests: ${{ steps.filter.outputs.manifests }}
      compose: ${{ steps.filter.outputs.compose }}
      suite_git: ${{ steps.filter.outputs.suite_git }}
      suite_macos: ${{ steps.filter.outputs.suite_macos }}
      suite_linux: ${{ steps.filter.outputs.suite_linux }}
      suite_windows: ${{ steps.filter.outputs.suite_windows }}
      suite_k8s: ${{ steps.filter.outputs.suite_k8s }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The diff needs the base commit, which a default depth-1 clone does
          # not have. This repository is small enough that a full clone costs
          # about a second.
          fetch-depth: 0

      - name: Work out what changed
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Fail open. Anything this step is not certain about is reported as
          # "changed", so a bug here can only ever make CI do more work than it
          # needs to, never less. That is the only safe direction for a filter
          # sitting in front of the test suites.
          full=1
          files=''
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
                files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
                full=0
              fi
              ;;
            push)
              zero=0000000000000000000000000000000000000000
              if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero" ] &&
                 git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
                full=0
              fi
              ;;
          esac

          # A change to CI itself, to the aggregator, or to the shared test
          # helpers invalidates every assumption below it, so treat it as a
          # change to everything.
          if [ "$full" -eq 0 ] && printf '%s\n' "$files" |
              grep -Eq '^(\.github/|run-tests\.sh$|test-env/lib/)'; then
            full=1
          fi

          if [ "$full" -eq 1 ]; then
            echo "no usable base diff, or CI/aggregator changed — running everything"
          else
            echo "changed files:"
            printf '%s\n' "$files" | sed 's/^/  /'
          fi

          emit() {
            local name="$1" pattern="$2" value=false
            if [ "$full" -eq 1 ] || printf '%s\n' "$files" | grep -Eq "$pattern"; then
              value=true
            fi
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
            printf '  %-14s %s\n' "$name" "$value"
          }

          echo
          echo "filters:"
          # The shell filter covers the Git Bash dotfiles by name as well as by
          # extension, for the same reason the lint job lists them explicitly:
          # they are real bash with no .sh on the end.
          emit shell         '(\.sh|\.zsh|\.bashrc|\.bash_profile|\.aliases)$'
          emit powershell    '(\.ps1|\.psm1|\.psd1)$'
          emit markdown      '(\.md$|markdownlint)'
          emit yaml          '(\.ya?ml|\.winget)$'
          emit python        '(\.py$|^pyproject\.toml$|^test-env/python/)'
          emit workflow      '^\.github/workflows/.*\.ya?ml$'
          emit dockerfile    '(^|/)Dockerfile$'
          emit manifests     '^(k8s-toolbox/(examples|debug)/|linux/cloud-init/).*\.ya?ml$'
          emit compose       '(^|/)docker-compose[^/]*\.ya?ml$'
          emit suite_git     '^git/'
          emit suite_macos   '^macos-initial-setup/'
          emit suite_linux   '^linux/'
          emit suite_windows '^windows/'
          emit suite_k8s     '^k8s-toolbox/'

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            printf '### Change filters\n\n'
            printf '| filter | runs |\n| --- | --- |\n'
            printf '| shell | %s |\n'      '${{ steps.filter.outputs.shell }}'
            printf '| powershell | %s |\n' '${{ steps.filter.outputs.powershell }}'
            printf '| markdown | %s |\n'   '${{ steps.filter.outputs.markdown }}'
            printf '| yaml | %s |\n'       '${{ steps.filter.outputs.yaml }}'
            printf '| python | %s |\n'     '${{ steps.filter.outputs.python }}'
            printf '| workflow | %s |\n'   '${{ steps.filter.outputs.workflow }}'
            printf '| Dockerfile | %s |\n' '${{ steps.filter.outputs.dockerfile }}'
            printf '| manifests | %s |\n'  '${{ steps.filter.outputs.manifests }}'
            printf '| Compose | %s |\n'    '${{ steps.filter.outputs.compose }}'
            printf '| git suite | %s |\n'     '${{ steps.filter.outputs.suite_git }}'
            printf '| macos suite | %s |\n'   '${{ steps.filter.outputs.suite_macos }}'
            printf '| linux suite | %s |\n'   '${{ steps.filter.outputs.suite_linux }}'
            printf '| windows suite | %s |\n' '${{ steps.filter.outputs.suite_windows }}'
            printf '| k8s suite | %s |\n'     '${{ steps.filter.outputs.suite_k8s }}'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The file list the Bash checks operate on, built once and reused.
      #
      # It used to be duplicated verbatim in the `bash -n` step and the
      # ShellCheck step, which is exactly the shape of thing that drifts: drop a
      # path from one copy and the other still looks right. It is built here,
      # NUL-delimited, and both consumers read it.
      #
      # The six Git Bash dotfiles have no .sh extension, so a plain '*.sh' glob
      # has never covered them. They are real bash and they pass, so they are
      # listed by name — and the presence of every one of them is asserted,
      # because a silently shrinking file list is a silently weakening gate.
      - name: Collect Bash sources
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotfiles=(
            windows/git-bash/.bashrc
            windows/git-bash/.bash_profile
            windows/git-bash/.aliases
            windows/git-bash/default-git-bash/.bashrc
            windows/git-bash/default-git-bash/.bash_profile
            windows/git-bash/default-git-bash/.aliases
          )
          git ls-files -z '*.sh' "${dotfiles[@]}" > "$RUNNER_TEMP/bash-sources"
          mapfile -d '' scripts < "$RUNNER_TEMP/bash-sources"

          for want in "${dotfiles[@]}"; do
            found=0
            for got in "${scripts[@]}"; do
              [ "$got" = "$want" ] && { found=1; break; }
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::$want is not in the ShellCheck file list — it was renamed, moved or deleted, and the linter would silently stop covering it"
              exit 1
            fi
          done

          printf 'collected %d bash sources (%d of them dotfiles)\n' \
            "${#scripts[@]}" "${#dotfiles[@]}"

      - name: Check Bash syntax
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < "$RUNNER_TEMP/bash-sources"
          bash -n "${scripts[@]}"

      # Fetched from the upstream release rather than apt. apt-get update alone
      # costs ~20s before a byte of the tool is downloaded, and it leaves the
      # Ubuntu image deciding the analyser version — the one unpinned tool in a
      # repository that pins everything else. This is both pinned and faster.
      # Cached for the same reason PSScriptAnalyzer is: the download is the
      # only part of this gate that depends on someone else's uptime. Run #75
      # went red when this step failed in under a second — the existing
      # `--retry 3` never fired, because curl retries timeouts and 5xx but not
      # a 4xx, so a rate-limited or briefly-missing asset fails immediately. A
      # cache hit skips the network altogether; the flags below cover the miss.
      #
      # The workflow filter is here as well as the shell one because actionlint
      # shells out to ShellCheck to analyse `run:` blocks: a workflow-only
      # change still needs the binary present, and without it that gate quietly
      # analyses nothing.
      - name: Cache ShellCheck
        id: shellcheck-cache
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ops-toolbox-shellcheck
          key: shellcheck-${{ runner.os }}-${{ env.SHELLCHECK_VERSION }}

      - name: Install ShellCheck
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/ops-toolbox-shellcheck"
          cached="$cache_dir/shellcheck"
          if [ ! -x "$cached" ]; then
            base=https://github.com/koalaman/shellcheck/releases/download
            url="$base/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
            # --retry-all-errors turns 4xx into a retryable case as well, which
            # is what the bare --retry was missing; --retry-connrefused covers a
            # refused connection. Together they make a transient blip cost
            # seconds instead of a red master.
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              --retry-connrefused --connect-timeout 10 \
              "$url" -o "$RUNNER_TEMP/shellcheck.tar.xz"
            tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
            mkdir -p "$cache_dir"
            install -m 0755 \
              "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$cached"
          fi
          sudo install -m 0755 "$cached" /usr/local/bin/shellcheck
          # Assert the pin took, so a redirected, stale or cached-wrong binary
          # cannot quietly downgrade the gate.
          got="$(shellcheck --version | awk '/^version:/ { print $2 }')"
          if [ "$got" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::wanted ShellCheck $SHELLCHECK_VERSION, got '$got'"
            exit 1
          fi

      # -x follows `source` directives, matching what the Docker suites already
      # do. Without it, sourced files are invisible to the analysis.
      # --shell=bash is required for the dotfiles: with no shebang ShellCheck
      # cannot detect the dialect and SC2148 fires at error severity.
      - name: Run ShellCheck
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < "$RUNNER_TEMP/bash-sources"
          shellcheck --severity=error -x --shell=bash "${scripts[@]}"

      - name: Install actionlint
        if: needs.changes.outputs.workflow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/rhysd/actionlint/releases/download
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --retry-connrefused --connect-timeout 10 \
            "$base/v${ACTIONLINT_VERSION}/$archive" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          got="$(actionlint -version | head -n 1)"
          if [ "$got" != "$ACTIONLINT_VERSION" ]; then
            echo "::error::wanted actionlint $ACTIONLINT_VERSION, got '$got'"
            exit 1
          fi

      - name: Lint GitHub Actions workflows
        if: needs.changes.outputs.workflow == 'true'
        run: actionlint

      - name: Install Hadolint
        if: needs.changes.outputs.dockerfile == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/hadolint/hadolint/releases/download
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --retry-connrefused --connect-timeout 10 \
            "$base/v${HADOLINT_VERSION}/hadolint-linux-x86_64" \
            -o "$RUNNER_TEMP/hadolint"
          sudo install -m 0755 "$RUNNER_TEMP/hadolint" /usr/local/bin/hadolint
          got="$(hadolint --version)"
          case "$got" in
            *"$HADOLINT_VERSION"*) ;;
            *)
              echo "::error::wanted Hadolint $HADOLINT_VERSION, got '$got'"
              exit 1
              ;;
          esac

      - name: Lint Dockerfiles
        if: needs.changes.outputs.dockerfile == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' dockerfiles < <(
            git ls-files -z | while IFS= read -r -d '' file; do
              [ "${file##*/}" = Dockerfile ] && printf '%s\0' "$file"
            done
          )
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "::error::Dockerfile filter ran but no tracked Dockerfiles were found"
            exit 1
          fi
          hadolint --failure-threshold error "${dockerfiles[@]}"

      # PSGallery installs are the slowest thing in this job by a wide margin,
      # and the module is pinned, so the cache key is exact and never stale.
      - name: Cache PSScriptAnalyzer
        id: pssa-cache
        if: needs.changes.outputs.powershell == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: pssa-${{ runner.os }}-${{ env.PSSA_VERSION }}

      - name: Install PSScriptAnalyzer
        if: needs.changes.outputs.powershell == 'true' && steps.pssa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION `
            -Force -Scope CurrentUser -AllowClobber

      # Gated at Error *and* Warning; see PSScriptAnalyzerSettings.psd1 for why
      # mirroring `shellcheck --severity=error` literally would find nothing.
      - name: Run PSScriptAnalyzer
        if: needs.changes.outputs.powershell == 'true'
        shell: pwsh
        run: |
          # -RequiredVersion so a cached or preinstalled copy of a different
          # version fails loudly instead of silently changing the ruleset.
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -ErrorAction Stop
          $files = git ls-files '*.ps1' '*.psm1'
          if (-not $files) { Write-Host 'no PowerShell files'; exit 0 }
          $found = @()
          foreach ($f in $files) {
            $found += Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($found.Count) {
            $found | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
            exit 1
          }
          Write-Host ('PSScriptAnalyzer clean over {0} files' -f $files.Count)

      - name: Cache pip downloads
        if: needs.changes.outputs.yaml == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-yamllint-${{ env.YAMLLINT_VERSION }}

      # pipx rather than pip: the runner's system Python is externally managed,
      # and pipx is preinstalled. This is also how the python job installs ruff.
      - name: Install yamllint
        if: needs.changes.outputs.yaml == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pipx install "yamllint==${YAMLLINT_VERSION}"
          got="$(yamllint --version)"
          if [ "$got" != "yamllint ${YAMLLINT_VERSION}" ]; then
            echo "::error::wanted yamllint $YAMLLINT_VERSION, got '$got'"
            exit 1
          fi

      - name: Lint YAML
        if: needs.changes.outputs.yaml == 'true'
        run: yamllint --config-file .yamllint.yml .

      - name: Lint Markdown
        if: needs.changes.outputs.markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: .markdownlint-cli2.yaml
          globs: '**/*.md'

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            printf '### Lint\n\n'
            printf '| check | ran |\n| --- | --- |\n'
            printf '| bash -n + ShellCheck %s | %s |\n' \
              "$SHELLCHECK_VERSION" \
              '${{ needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true' }}'
            printf '| actionlint %s | %s |\n' \
              "$ACTIONLINT_VERSION" '${{ needs.changes.outputs.workflow }}'
            printf '| Hadolint %s | %s |\n' \
              "$HADOLINT_VERSION" '${{ needs.changes.outputs.dockerfile }}'
            printf '| PSScriptAnalyzer %s | %s |\n' \
              "$PSSA_VERSION" '${{ needs.changes.outputs.powershell }}'
            printf '| yamllint %s | %s |\n' \
              "$YAMLLINT_VERSION" '${{ needs.changes.outputs.yaml }}'
            printf '| markdownlint | %s |\n' '${{ needs.changes.outputs.markdown }}'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate / schemas
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: >-
          needs.changes.outputs.manifests == 'true' ||
          needs.changes.outputs.compose == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install kubeconform
        if: needs.changes.outputs.manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/yannh/kubeconform/releases/download
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --retry-connrefused --connect-timeout 10 \
            "$base/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/kubeconform.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" \
            -C "$RUNNER_TEMP" kubeconform
          sudo install -m 0755 \
            "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          got="$(kubeconform -v)"
          if [ "$got" != "v$KUBECONFORM_VERSION" ]; then
            echo "::error::wanted kubeconform v$KUBECONFORM_VERSION, got '$got'"
            exit 1
          fi

      - name: Validate Kubernetes manifests
        if: needs.changes.outputs.manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            -skip Kustomization \
            k8s-toolbox/examples \
            k8s-toolbox/debug

      - name: Validate cloud-init configuration
        if: needs.changes.outputs.manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cloud-init >/dev/null 2>&1; then
            # cloud-init is part of Ubuntu itself rather than a standalone
            # release binary. Install it from the package repository belonging
            # to the pinned ubuntu-24.04 runner image.
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cloud-init
          fi
          cloud-init --version
          cloud-init schema --config-file linux/cloud-init/kali-vm-init.yaml

      - name: Validate Docker Compose models
        if: needs.changes.outputs.compose == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' compose_files < <(
            git ls-files -z | while IFS= read -r -d '' file; do
              case "${file##*/}" in
                docker-compose.yml|docker-compose.yaml)
                  printf '%s\0' "$file"
                  ;;
              esac
            done
          )
          if [ "${#compose_files[@]}" -eq 0 ]; then
            echo "::error::Compose filter ran but no base models were found"
            exit 1
          fi
          for file in "${compose_files[@]}"; do
            echo "validating $file"
            if [ "$file" = mikrotik/tests/docker-compose.yml ]; then
              docker compose \
                --env-file mikrotik/tests/routeros-version.env \
                -f "$file" config --quiet
            else
              docker compose -f "$file" config --quiet
            fi
          done

          # The KVM file is intentionally an overlay and is not a valid model
          # alone. Validate the exact layered form used by the CHR runner.
          docker compose \
            --env-file mikrotik/tests/routeros-version.env \
            -f mikrotik/tests/docker-compose.yml \
            -f mikrotik/tests/docker-compose.kvm.yml \
            config --quiet

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            printf '### Schema validation\n\n'
            printf '| check | ran |\n| --- | --- |\n'
            printf '| kubeconform %s + cloud-init | %s |\n' \
              "$KUBECONFORM_VERSION" '${{ needs.changes.outputs.manifests }}'
            printf '| Docker Compose config | %s |\n' \
              '${{ needs.changes.outputs.compose }}'
          } >> "$GITHUB_STEP_SUMMARY"

  macos-native:
    name: Test / macos native
    needs: changes
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: needs.changes.outputs.suite_macos == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ShellCheck
        if: needs.changes.outputs.suite_macos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) asset_arch=aarch64 ;;
            x86_64) asset_arch=x86_64 ;;
            *)
              echo "::error::unsupported macOS architecture: $(uname -m)"
              exit 1
              ;;
          esac
          base=https://github.com/koalaman/shellcheck/releases/download
          archive="shellcheck-v${SHELLCHECK_VERSION}.darwin.${asset_arch}.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --retry-connrefused --connect-timeout 10 \
            "$base/v${SHELLCHECK_VERSION}/$archive" \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          got="$(shellcheck --version | awk '/^version:/ { print $2 }')"
          [ "$got" = "$SHELLCHECK_VERSION" ] || {
            echo "::error::wanted ShellCheck $SHELLCHECK_VERSION, got '$got'"
            exit 1
          }

      - name: Run contracts with Apple Bash
        if: needs.changes.outputs.suite_macos == 'true'
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/macos-native.log"
          set +e
          REPO_ROOT="$GITHUB_WORKSPACE" \
            /bin/bash macos-initial-setup/tests/test_macos_initial_setup.sh \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          {
            printf '### Native macOS contracts\n\n'
            printf 'Runner: `%s`; Bash: `%s`\n\n' \
              "$(sw_vers -productVersion)" "$(/bin/bash --version | head -n 1)"
            printf '```text\n%s\n```\n' "$(tail -n 20 "$log")"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Report skip
        if: needs.changes.outputs.suite_macos != 'true'
        run: echo '### Native macOS contracts' >> "$GITHUB_STEP_SUMMARY"

  windows-native:
    name: Test / windows native
    needs: changes
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: needs.changes.outputs.suite_windows == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run contracts on Windows
        if: needs.changes.outputs.suite_windows == 'true'
        shell: bash
        run: ./run-tests.sh windows

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            printf '### Native Windows contracts\n\n'
            if [ '${{ needs.changes.outputs.suite_windows }}' = true ]; then
              printf 'Ran Git Bash and PowerShell contracts on `windows-2025`.\n'
            else
              printf 'Skipped — no Windows files changed.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Suites go through run-tests.sh rather than calling each tests/run.sh
  # directly, so the aggregator is exercised by CI too and "it passed locally"
  # and "it passed in CI" mean the same thing. Matrix values are run-tests.sh
  # suite names, not directory names.
  test:
    name: Test / ${{ matrix.check_name }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `include` rather than a bare list so each entry can carry its own
        # change filter. `changed` is read by the step-level `if` below, which
        # keeps the job reporting success when there is nothing to do.
        include:
          - check_name: git
            suite: git
            changed: ${{ needs.changes.outputs.suite_git }}
          - check_name: macos
            suite: macos
            changed: ${{ needs.changes.outputs.suite_macos }}
          # Keep the historical `Test / linux` name for the Debian fixture so
          # an existing required-check rule continues to report. Fedora and
          # Arch run as separate jobs: failures identify the affected package
          # manager immediately, and the three images build in parallel.
          - check_name: linux
            suite: linux
            linux_distro: debian
            changed: ${{ needs.changes.outputs.suite_linux }}
          - check_name: linux (fedora)
            suite: linux
            linux_distro: fedora
            changed: ${{ needs.changes.outputs.suite_linux }}
          - check_name: linux (arch)
            suite: linux
            linux_distro: arch
            changed: ${{ needs.changes.outputs.suite_linux }}
          # Needs pwsh, which the ubuntu image ships preinstalled. The suite
          # skips itself with exit 0 on a host without it, so the job asserts
          # pwsh is really there rather than trusting a green tick.
          - check_name: windows
            suite: windows
            changed: ${{ needs.changes.outputs.suite_windows }}
          # Contract checks on the k8s-toolbox scripts; needs nothing but bash.
          # It deliberately does not build the image — five pinned toolchains
          # pulled from five hosts is minutes of network per run, and the
          # scripts that drive the build are what regress. K8S_IMAGE_SMOKE=1
          # runs the real build when that is what you want to verify.
          - check_name: k8s
            suite: k8s
            changed: ${{ needs.changes.outputs.suite_k8s }}
    steps:
      - name: Check out repository
        if: matrix.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require pwsh
        if: matrix.changed == 'true' && matrix.suite == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::pwsh is missing from this runner — windows/tests/run.sh would skip itself and exit 0, and the gate would pass without checking anything"
            exit 1
          fi
          pwsh --version

      - name: Run suite
        if: matrix.changed == 'true'
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          # Empty for non-Linux entries. linux/tests/run.sh treats an explicit
          # distro exactly like the equivalent local LINUX_DISTROS invocation.
          LINUX_DISTROS: ${{ matrix.linux_distro }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/$SUITE.log"
          # `shell: bash` runs with -e, which would abort the step on a failing
          # suite before the summary is written. Take the exit code by hand.
          set +e
          ./run-tests.sh "$SUITE" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          # run-tests.sh already prints a pass/fail/skip matrix; lift it into
          # the run summary so the verdict is visible without opening logs.
          summary="$(awk '/^=== summary ===$/{p=1} p' "$log")"
          [ -n "$summary" ] || summary="$(tail -n 20 "$log")"
          {
            printf '### `run-tests.sh %s`\n\n' "$SUITE"
            printf '```text\n%s\n```\n\n' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Report skip
        if: matrix.changed != 'true'
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          printf '### `run-tests.sh %s`\n\nSkipped — nothing in this change touches it.\n' \
            "$SUITE" >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Test / python helpers
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: needs.changes.outputs.python == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 3.9 is what /usr/bin/python3 provides on macOS, and it is the
      # interpreter stay_fresh.sh invokes lib/workspace_scan.py with. Testing on
      # anything newer would let 3.10+ syntax through and break on the machines
      # these scripts target.
      - name: Set up Python 3.9
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.9'

      # test-env/python/run.sh reports ruff as "skipped" and still exits 0 when
      # it is absent, so without this step the lint silently never ran. ruff
      # ships a static binary, which is both pinned and faster than resolving it
      # through pipx — and it is a standalone tool, so it does not need to live
      # in the 3.9 environment under test.
      - name: Install ruff
        if: needs.changes.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --retry-connrefused --connect-timeout 10 \
            "$url" -o "$RUNNER_TEMP/ruff.tar.gz"
          tar -xzf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/ruff-x86_64-unknown-linux-gnu/ruff" /usr/local/bin/ruff
          got="$(ruff --version)"
          if [ "$got" != "ruff ${RUFF_VERSION}" ]; then
            echo "::error::wanted ruff $RUFF_VERSION, got '$got'"
            exit 1
          fi

      - name: Run python suite
        if: needs.changes.outputs.python == 'true'
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/python.log"
          set +e
          ./run-tests.sh python 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          summary="$(awk '/^=== summary ===$/{p=1} p' "$log")"
          [ -n "$summary" ] || summary="$(tail -n 20 "$log")"
          {
            printf '### `run-tests.sh python`\n\n'
            printf '```text\n%s\n```\n\n' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Report skip
        if: needs.changes.outputs.python != 'true'
        run: |
          printf '### `run-tests.sh python`\n\nSkipped — no Python changed.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  # Repository-wide convention checks: the --help and unknown-flag contracts,
  # shebangs, file modes, .gitattributes coverage, Bash 3.2 constructs and the
  # deliberately-duplicated blocks. Needs nothing but bash and git, and it
  # discovers its own subjects so a new script is covered by the commit that
  # adds it.
  #
  # Deliberately has no change filter. Its subjects are the whole repository —
  # a new file extension, a mode change or a renamed script can break it without
  # touching anything the filters above would notice — and it costs seconds.
  static:
    name: Test / conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run static suite
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/static.log"
          set +e
          ./run-tests.sh static 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          summary="$(awk '/^=== summary ===$/{p=1} p' "$log")"
          [ -n "$summary" ] || summary="$(tail -n 20 "$log")"
          {
            printf '### `run-tests.sh static`\n\n'
            printf '```text\n%s\n```\n\n' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
