name: Release

# Step two of cutting a release; release-prepare.yml is step one. The whole
# process:
#
#   1. Feature pull requests merge to dev; dev is merged into master (merge
#      commit), and every push to master deploys the stage site (docs.yml).
#   2. A release is prepared by release-prepare.yml, which pushes a
#      release/<version> branch. A person opens the pull request from it, so
#      it gets its checks, and merges it like any other change. That puts
#      "## [<version>]" in CHANGELOG.md on master and deploys stage. It does
#      not tag, release or deploy production.
#   3. This workflow, run by hand from master with the version, once stage is
#      good. It checks that master's HEAD carries the version's heading and
#      that CI, Security and the docs site passed on HEAD, tags HEAD
#      v<version> (annotated), creates the GitHub Release whose notes are the
#      version's section, and then deploys production through docs.yml.
#
# Re-running it after a failure finishes the job: a tag that already points at
# HEAD is kept, an existing release is left alone, and the deploy runs again,
# even if master has moved on since (the tag's commit must still be on master).
# Tagging itself is stricter: master's head is read from the remote again just
# before the tag is pushed, and if it is no longer the run's commit nothing is
# tagged (a window of a moment remains between that read and the push).
# A tag on any other commit is an error. To redeploy or promote a tag by hand:
# gh workflow run docs.yml --ref vX.Y.Z.
#
# Nothing here writes to master.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, MAJOR.MINOR.PATCH (e.g. 1.0.0); tagged v<version> on master's HEAD
        required: true
        type: string

permissions:
  contents: read

# The same group as release-prepare.yml, so a prepare and a publish never overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # push the tag and create the release
      actions: read    # read the workflow runs on HEAD
    env:
      # Through the environment, never interpolated into a script: the input
      # is free text typed into a form.
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    outputs:
      # The tag this run published, for the documentation site's deploy below.
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate the request
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::run this workflow from master, not ${GITHUB_REF#refs/heads/}"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH, e.g. 1.0.0 (got '$VERSION')"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check master's HEAD is the release
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          # The commit the run started on is the one that is checked, tagged
          # and deployed. If master has moved since, the checks below would be
          # about the wrong commit: start the run again. The exception is a
          # re-run after a partial failure: when the tag is already on this
          # commit and the commit is still on master, nothing is checked or
          # tagged again, so a later merge must not block finishing the job.
          git fetch --no-tags origin master
          master_head="$(git rev-parse FETCH_HEAD)"
          tag_here=false
          # ls-remote patterns match the tail of a ref name, so a tag such as
          # x/refs/tags/v1 would match too: keep only the exact ref. A failing
          # ls-remote fails the step (pipefail).
          tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" |
            ref="refs/tags/$TAG" awk '$2 == ENVIRON["ref"] {print $1}')"
          if [ -n "$tag_sha" ]; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG exists on another commit than master's HEAD; delete it or release a newer version"
              exit 1
            fi
            tag_here=true
          fi
          if [ "$master_head" != "$GITHUB_SHA" ]; then
            if [ "$tag_here" = true ] && git merge-base --is-ancestor "$GITHUB_SHA" "$master_head"; then
              echo "master moved on, but $TAG is already on this run's commit, which is still on master; finishing the release."
            else
              echo "::error::master moved on since this run started; run the workflow again"
              exit 1
            fi
          fi

          # grep without -q, so it reads all of its input (SIGPIPE under pipefail).
          if ! grep -F "## [$VERSION]" CHANGELOG.md >/dev/null; then
            echo "::error::CHANGELOG.md on master has no '## [$VERSION]' section; merge the release pull request first"
            exit 1
          fi
          rc=0
          latest="$(changelog.d/changelog.sh latest)" || rc=$?
          if [ "$rc" -ne 0 ] || [ "$latest" != "$VERSION" ]; then
            echo "::error::$VERSION is not the newest release in CHANGELOG.md (newest: ${latest:-none})"
            exit 1
          fi

          if [ "$tag_here" = true ]; then
            echo "$TAG already points at HEAD; not tagging again."
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

      # The master ruleset's required checks are not read here; the three
      # workflows that run on every push to master are. CI and Security must
      # have run and passed on HEAD. The docs site runs only on pushes that
      # touch the site, so it may be absent, but a run that is there must have
      # passed.
      - name: Check CI, Security and the docs site passed on HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
            --jq '.workflow_runs | map({name, status, conclusion})')"
          failed=0
          for spec in "CI:required" "Security:required" "Docs site:optional"; do
            name="${spec%:*}"
            need="${spec#*:}"
            state="$(jq -r --arg n "$name" '
              [.[] | select(.name == $n)]
              | if length == 0 then "missing"
                elif all(.status == "completed" and .conclusion == "success") then "ok"
                else "not green" end' <<< "$runs")"
            case "$state" in
              ok) echo "$name: passed on $GITHUB_SHA" ;;
              missing)
                if [ "$need" = optional ]; then
                  echo "$name: no push run on $GITHUB_SHA (it runs only for site changes)"
                else
                  echo "::error::$name has no push run on $GITHUB_SHA"
                  failed=1
                fi ;;
              *)
                echo "::error::$name is not green on $GITHUB_SHA (still running, failed or cancelled)"
                failed=1 ;;
            esac
          done
          exit "$failed"

      - name: Create tag
        if: steps.plan.outputs.create_tag == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # The checkout kept no credentials, so the token is given to the
          # remote calls below only, the way actions/checkout would have
          # configured it.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # Master may have moved since the plan step: a pull request merged
          # in the meantime would leave this run tagging and deploying an older
          # commit. Read master's head again from the remote, just before the
          # push, and refuse if it is not this run's commit. (A re-run that
          # finds the tag already on this commit never gets here: the plan step
          # sets create_tag=false and finishes the release without tagging.)
          # ls-remote patterns match the tail of a ref name, so a branch such
          # as foo/refs/heads/master would match too: keep only the exact ref.
          # A failing ls-remote fails the step (pipefail).
          master_now="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin refs/heads/master |
            awk '$2 == "refs/heads/master" {print $1}')"
          if [ "$master_now" != "$GITHUB_SHA" ]; then
            echo "::error::master moved on to ${master_now:-an unknown commit} since this run started, just before the tag was pushed; nothing was tagged. Run the workflow again"
            exit 1
          fi
          git tag -a "$TAG" -m "$VERSION" "$GITHUB_SHA"
          # A tag pushed with GITHUB_TOKEN starts no other workflow; anything
          # that should build on a release belongs in this workflow.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          changelog.d/changelog.sh notes "$VERSION" > "$notes"

          # GitHub caps a release body at 125,000 characters, and the first
          # release carries every entry written before versions existed -
          # over 200 KB. Past the cap the body links to the section at the
          # tag instead, and the full notes are attached so nothing is lost.
          # Bytes are counted, which is never fewer than characters.
          if [ "$(wc -c < "$notes")" -le 120000 ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          else
            asset="$RUNNER_TEMP/CHANGELOG-$VERSION.md"
            cp "$notes" "$asset"
            items="$(grep -c '^- ' "$notes" || true)"
            short="$RUNNER_TEMP/short.md"
            {
              printf 'This release has %s changelog entries, more than a release description can hold.\n\n' "$items"
              printf 'Read them in [CHANGELOG.md at %s](%s/%s/blob/%s/CHANGELOG.md), or download the attached `CHANGELOG-%s.md`.\n' \
                "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" "$VERSION"
            } > "$short"
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$short" "$asset"
          fi

      - name: Summarise
        if: always()
        shell: bash
        env:
          CREATE_TAG: ${{ steps.plan.outputs.create_tag }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            printf '### Release %s\n\n' "$VERSION"
            if [ "$JOB_STATUS" != success ]; then
              printf 'Not published; see the failed step above.\n'
            elif [ "$CREATE_TAG" = 'true' ]; then
              printf 'Tagged `%s` at `%s` and published the release. Approve the `production` deployment when GitHub asks.\n' "$TAG" "$GITHUB_SHA"
            else
              printf '`%s` already existed at `%s`; checked the release and redeployed.\n' "$TAG" "$GITHUB_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A tag and a release created with GITHUB_TOKEN start no other workflow, so
  # the production deploy of the documentation site is called from here
  # instead of being triggered by the release. A called workflow gets no
  # secrets unless the caller passes them, environment secrets included (they
  # resolve to an empty string otherwise), so both are passed by name, not with
  # "secrets: inherit". docs.yml's deploy job reads the environment's values.
  docs-site:
    name: Deploy documentation site
    needs: publish
    permissions:
      contents: read
      # docs.yml's jobs ask for deployments: read; a called workflow cannot
      # hold more than the calling job grants.
      deployments: read
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
