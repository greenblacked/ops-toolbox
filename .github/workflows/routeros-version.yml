name: RouterOS version check

# Check MikroTik's stable feed every six hours and on demand. A changed release
# triggers CHR once, then either a tested bump PR or a failure issue. The issue
# prevents expensive automatic retries until an operator closes it, and a bump
# PR that was closed without merging is never regenerated. Never modify
# dev/master directly; hardware safety review is still required.
#
# Scheduled runs and manual bump requests both use dev as their baseline.
# Manual check-only runs validate the selected ref without proposing a PR.
# The dev branch must exist for scheduled or manual bump requests.
on:
  schedule:
    # Lightweight stable-feed check four times daily at offset minutes.
    # CHR boots only when a newer version has no bump PR (open, merged or
    # closed) and no open failure issue.
    # Scheduled workflows run from default branch (master), so changes to
    # this file become active only after merging it into master.
    - cron: '19 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: RouterOS channel (long-term requires check-only mode)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - long-term
      version:
        description: Explicit RouterOS version (leave empty to use the release feed)
        required: false
        type: string
      check_only:
        description: Test the candidate without changing files or opening a PR
        required: true
        default: false
        type: boolean

# Nothing here needs a repository-wide grant: one job commits a branch, opens
# a pull request and files the failure issue, another dispatches CI, and
# holding those scopes at the top level would hand them to any job added to
# this workflow later with no review able to tell. Least privilege lives on
# the job instead, so a future job here starts with nothing rather than
# inheriting write scopes it never asked for.
permissions: {}

concurrency:
  group: routeros-version-check
  cancel-in-progress: false

jobs:
  check-test-and-propose:
    name: Check, test, and propose RouterOS bump
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # The bump branch, empty when nothing was pushed. The dispatch job below
    # reads it, so no step that runs checked-out dev code needs `actions: write`.
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
    permissions:
      # Commits the version bump to a branch this job creates.
      contents: write
      # Opens (and updates) the pull request that proposes the bump.
      pull-requests: write
      # Record a failed candidate once, instead of losing its test evidence.
      issues: write
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      REQUESTED_VERSION: ${{ inputs.version || '' }}
      CHECK_ONLY: ${{ inputs.check_only == true }}
      # Marks the issues this workflow files, so the dedupe below cannot be
      # steered by an unrelated issue that merely shares a title.
      FAILURE_LABEL: routeros-candidate-failure
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Both scheduled and manual bump runs base changes on dev, which is
          # also the pull request target. Only check-only uses the chosen ref.
          # This prevents a manual run on stale master from reverting dev work.
          ref: ${{ inputs.check_only == true && github.ref || 'dev' }}
          fetch-depth: 0

      - name: Resolve candidate release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          args=(check --channel "$RELEASE_CHANNEL" --format github)
          if [ -n "$REQUESTED_VERSION" ]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          if [ "$CHECK_ONLY" != "true" ]; then
            args+=(--for-version-bump)
          fi
          python3 mikrotik/tests/routeros_version.py "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Check for an existing bump pull request
        id: existing
        if: steps.release.outputs.update_available == 'true' && inputs.check_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          branch="deps/routeros-${TARGET_VERSION}"
          # --state all, not open: a bump PR that a maintainer closed without
          # merging is a decision, and a merged one is done. Either way the
          # next poll must not re-test the version and open the PR again.
          # --head matches the branch name alone, so a pull request from a
          # fork's branch of the same name is ignored (isCrossRepository).
          found="$(gh pr list --state all --head "$branch" \
            --json url,state,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)] | .[0] // empty | "\(.url) \(.state)"')"
          if [ -n "$found" ]; then
            url="${found%% *}"
            state="${found##* }"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "state=$state" >> "$GITHUB_OUTPUT"
            echo "Skipping RouterOS ${TARGET_VERSION}: pull request $url is already $state."
          fi

      - name: Check for existing failed candidate
        id: recorded_failure
        if: >-
          steps.release.outputs.update_available == 'true' &&
          inputs.check_only != true &&
          steps.existing.outputs.url == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          title="RouterOS ${TARGET_VERSION} CHR compatibility failure"
          # Only an issue this workflow filed counts: it carries the label and
          # the Actions bot as author. The repository is public, so a title
          # alone would let anyone open a lookalike issue and switch the bump
          # off. The label narrows the list to the few issues this workflow
          # filed, so the 100-item window is not the newest 100 open issues
          # of the repository; the exact title and the author are checked
          # here. No title search: the search index lags behind new issues
          # and has its own rate limit.
          issues="$(gh issue list --state open --label "$FAILURE_LABEL" \
            --limit 100 --json title,url,author)"
          url="$(printf '%s' "$issues" | TARGET_TITLE="$title" python3 -c '
          import json, os, sys
          title = os.environ["TARGET_TITLE"]
          bots = ("app/github-actions", "github-actions")
          print(next((item["url"] for item in json.load(sys.stdin)
                      if item["title"] == title and (item.get("author") or {}).get("login") in bots), ""))
          ')"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Candidate already failed; see $url (close issue to retry)."
          fi

      # /dev/kvm is crw-rw---- root:kvm and the runner user is not in that
      # group, so run.sh's readable-and-writable test fails and CHR boots under
      # TCG. See chr.yml for the longer version of why that went unnoticed.
      - name: Enable KVM access
        if: >-
          (steps.release.outputs.update_available == 'true' || inputs.check_only == true) &&
          steps.existing.outputs.url == '' &&
          steps.recorded_failure.outputs.url == ''
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm on this runner — CHR will boot under TCG emulation"
          fi

      - name: Test candidate on RouterOS CHR
        id: candidate
        if: >-
          (steps.release.outputs.update_available == 'true' || inputs.check_only == true) &&
          steps.existing.outputs.url == '' &&
          steps.recorded_failure.outputs.url == ''
        shell: bash
        env:
          ROUTEROS_VERSION: ${{ steps.release.outputs.latest }}
          EXPECT_ROUTEROS_VERSION: ${{ steps.release.outputs.latest }}
        run: |
          set -uo pipefail
          # The candidate is a version this repository has never pinned, so the
          # recorded ROUTEROS_SHA256 is the *previous* version's. Building the
          # candidate with it made the download fail its checksum every time -
          # the same mismatch bump_version's docstring warns about, one step
          # earlier, and the reason no candidate has ever got past this step.
          # run.sh already prefers an exported digest over the pinned one, so
          # resolving the candidate's own is all that was missing.
          #
          # This is a first observation, not an independent verification:
          # nothing publishes a checksum to check it against. It catches a
          # truncated or corrupted download and a mirror serving two different
          # bodies. It becomes a real anchor only when 'bump' commits it, which
          # is why that digest is carried forward rather than recomputed.
          if ! ROUTEROS_SHA256="$(python3 mikrotik/tests/routeros_version.py \
                record-hash --version "$ROUTEROS_VERSION" --print)"; then
            echo "could not resolve a SHA-256 for RouterOS $ROUTEROS_VERSION" >&2
            exit 1
          fi
          export ROUTEROS_SHA256
          echo "candidate digest: $ROUTEROS_SHA256"
          echo "digest=$ROUTEROS_SHA256" >> "$GITHUB_OUTPUT"

          log="$RUNNER_TEMP/mikrotik-version.log"
          set +e
          ./run-tests.sh mikrotik 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          summary="$(awk '/^=== summary ===$/{p=1} p' "$log")"
          [ -n "$summary" ] || summary="$(tail -n 20 "$log")"
          {
            printf '### RouterOS %s candidate test\n\n' "$ROUTEROS_VERSION"
            printf '```text\n%s\n```\n\n' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Record a failed release-candidate test
        if: >-
          failure() &&
          steps.candidate.outcome == 'failure' &&
          inputs.check_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          title="RouterOS ${TARGET_VERSION} CHR compatibility failure"
          body="$RUNNER_TEMP/routeros-candidate-failure.md"
          {
            echo "The official stable feed reported RouterOS ${TARGET_VERSION}."
            echo
            echo "The candidate could not pass the repository CHR compatibility test."
            echo "This is **not** evidence of an hAP ax2 hardware regression."
            echo
            echo "- [Failed workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Baseline remains unchanged; do not promote this version."
            echo "- Close this issue to allow the next scheduled run to retry,"
            echo "  or run check-only manually for an immediate recheck."
            if [ -f "$RUNNER_TEMP/mikrotik-version.log" ]; then
              echo
              echo '### Test suite summary'
              echo '~~~text'
              awk '/^=== summary ===$/{p=1} p' "$RUNNER_TEMP/mikrotik-version.log" | head -n 15
              echo
              echo '~~~'
            fi
          } > "$body"
          # The label is what the lookup above counts, but the test evidence
          # matters more than the label: neither step may stop the issue from
          # being filed. Create the label only when it is missing, so a
          # description or colour edited by hand is not overwritten.
          labels="$(gh label list --search "$FAILURE_LABEL" --json name --jq '.[].name' || true)"
          if ! printf '%s\n' "$labels" | grep -Fxq "$FAILURE_LABEL"; then
            gh label create "$FAILURE_LABEL" --color B60205 \
              --description "RouterOS release candidate that failed the CHR test" \
              || echo "::warning::could not create label $FAILURE_LABEL"
          fi
          if ! gh issue create --title "$title" --body-file "$body" --label "$FAILURE_LABEL"; then
            echo "::warning::could not label the issue $FAILURE_LABEL; label it by hand or the next poll retests this version"
            gh issue create --title "$title" --body-file "$body"
          fi

      - name: Bump version and documentation
        if: >-
          steps.release.outputs.update_available == 'true' &&
          steps.existing.outputs.url == '' &&
          steps.recorded_failure.outputs.url == '' &&
          steps.candidate.outcome == 'success' &&
          inputs.check_only != true
        env:
          TARGET_VERSION: ${{ steps.release.outputs.latest }}
          TESTED_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          # Pin the digest the candidate test actually ran against. Recomputing
          # here would re-download, and a republished artifact would pin bytes
          # nothing has booted.
          if [ -z "$TESTED_DIGEST" ]; then
            echo "refusing RouterOS bump without the successfully tested archive digest" >&2
            exit 1
          fi
          python3 mikrotik/tests/routeros_version.py bump "$TARGET_VERSION" --digest "$TESTED_DIGEST"

      - name: Commit bump branch
        id: commit
        if: >-
          steps.release.outputs.update_available == 'true' &&
          steps.existing.outputs.url == '' &&
          steps.recorded_failure.outputs.url == '' &&
          steps.candidate.outcome == 'success' &&
          inputs.check_only != true
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          branch="deps/routeros-${TARGET_VERSION}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # Read the remote tip *before* doing any local work, and pass it to
          # --force-with-lease explicitly. Bare --force-with-lease compares
          # against the remote-tracking ref, so fetching that ref just before
          # the push refreshes the lease to whatever is on the remote right
          # then — the check can never fire and the push is a plain --force.
          # Capturing the SHA up front is what makes the lease mean something:
          # a hand-pushed fix that lands on this branch mid-run aborts the push
          # instead of being silently overwritten.
          remote_sha=""
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            remote_sha="$(git rev-parse "refs/remotes/origin/$branch")"
          fi

          git switch -C "$branch"
          git add \
            mikrotik/tests/routeros-version.env \
            README.md mikrotik/README.md mikrotik/tests/README.md \
            docs/platforms/mikrotik.md docs/contributing/testing.md \
            docs/platforms/routeros-compatibility.md \
            CHANGELOG.md
          git commit -m "deps(mikrotik): test against RouterOS ${TARGET_VERSION}"

          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" \
              --set-upstream origin "$branch"
          else
            # The branch did not exist when we looked. A plain push is the
            # right lease here: it is rejected if someone created it meanwhile.
            git push --set-upstream origin "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open bump pull request
        id: pull_request
        if: steps.commit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ steps.release.outputs.latest }}
          BUMP_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          The official RouterOS release feed reports ${TARGET_VERSION}.

          This pull request was created only after the CHR ${TARGET_VERSION} image booted and the full MikroTik Docker integration suite passed.

          Trigger: ${GITHUB_EVENT_NAME}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          url="$(gh pr create \
            --base dev \
            --head "$BUMP_BRANCH" \
            --title "deps(mikrotik): test against RouterOS ${TARGET_VERSION}" \
            --body "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise release check
        if: always()
        shell: bash
        env:
          RESULT_CHANNEL: ${{ steps.release.outputs.channel }}
          RESULT_CURRENT: ${{ steps.release.outputs.current }}
          RESULT_LATEST: ${{ steps.release.outputs.latest }}
          RESULT_UPDATE_AVAILABLE: ${{ steps.release.outputs.update_available }}
          EXISTING_PR_URL: ${{ steps.existing.outputs.url }}
          EXISTING_PR_STATE: ${{ steps.existing.outputs.state }}
          CREATED_PR_URL: ${{ steps.pull_request.outputs.url }}
          PREVIOUS_FAILURE_URL: ${{ steps.recorded_failure.outputs.url }}
          CHECK_ONLY_REQUESTED: ${{ inputs.check_only }}
        run: |
          {
            printf '### RouterOS release check\n\n'
            printf '| item | value |\n| --- | --- |\n'
            printf '| channel | `%s` |\n' "$RESULT_CHANNEL"
            printf '| pinned | `%s` |\n' "$RESULT_CURRENT"
            printf '| candidate | `%s` |\n' "$RESULT_LATEST"
            printf '| update available | `%s` |\n' "$RESULT_UPDATE_AVAILABLE"
            if [ -n "$EXISTING_PR_URL" ]; then
              printf '\nExisting pull request (%s), not regenerated: %s\n' "$EXISTING_PR_STATE" "$EXISTING_PR_URL"
            elif [ -n "$CREATED_PR_URL" ]; then
              printf '\nCreated pull request: %s\n' "$CREATED_PR_URL"
            elif [ -n "$PREVIOUS_FAILURE_URL" ]; then
              printf '\nPreviously failed candidate: %s\n' "$PREVIOUS_FAILURE_URL"
            elif [ "$CHECK_ONLY_REQUESTED" = 'true' ]; then
              printf '\nCheck-only mode: no repository changes were made.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # PRs created by GITHUB_TOKEN do not fire pull_request workflows. Start CI,
  # security and CHR against the exact bump branch explicitly. Docs and
  # branch-name PR checks still need verifying before manual merge; none of
  # these jobs auto-merge or touch physical hardware.
  #
  # This is its own job so that the dispatch scope, `actions: write`, is not
  # held by the job that runs routeros_version.py and run-tests.sh from the
  # dev tree. That job still has `contents: write`, `pull-requests: write` and
  # `issues: write`, and its checkout keeps credentials for the push step, so
  # this does not isolate it; it only removes the ability to dispatch
  # arbitrary workflows from it. This job checks out nothing and only runs
  # `gh`, and the one value it takes from the job above is validated before
  # use.
  dispatch-validation:
    name: Dispatch validation checks for bump branch
    needs: check-test-and-propose
    # !cancelled() rather than success(): the branch is pushed before the pull
    # request is opened, and checks were dispatched even if opening it failed.
    if: ${{ !cancelled() && needs.check-test-and-propose.outputs.branch != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Dispatches the CI, security and CHR workflows. Nothing else.
      actions: write
    steps:
      - name: Dispatch validation checks for bump branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUMP_BRANCH: ${{ needs.check-test-and-propose.outputs.branch }}
        run: |
          set -euo pipefail
          # The branch name was produced by code from dev. Accept only the
          # shape the commit step builds, so a bad value cannot point the
          # dispatch at some other ref.
          # Mirrors VERSION_RE in mikrotik/tests/routeros_version.py.
          if ! [[ "$BUMP_BRANCH" =~ ^deps/routeros-[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "refusing to dispatch for unexpected branch name: $BUMP_BRANCH" >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "$BUMP_BRANCH"
          gh workflow run security.yml --ref "$BUMP_BRANCH"
          gh workflow run chr.yml --ref "$BUMP_BRANCH"
