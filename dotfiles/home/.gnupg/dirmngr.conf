# GnuPG - dirmngr options. Reload with: gpgconf --kill dirmngr
#
# The keyserver belongs here in GnuPG 2.x, and since 2.5.3 there is no
# default at all: without this line `gpg --recv-keys` has nowhere to go.
# keys.openpgp.org verifies e-mail addresses before publishing them, which
# is what stopped the flood of fake keys the SKS pool suffered from.
keyserver hkps://keys.openpgp.org
