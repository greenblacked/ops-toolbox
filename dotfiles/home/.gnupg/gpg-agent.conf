# GnuPG - agent options. Reload with: gpgconf --kill gpg-agent
#
# Values from doc/gpg-agent.texi. The two TTLs are the whole point of this
# file: the defaults keep a passphrase for ten minutes after each use and
# two hours overall, which on a laptop is long enough to walk away from.

# Seconds a cached passphrase stays valid after its last use, and the hard
# ceiling regardless of use. Defaults 600 and 7200.
default-cache-ttl 300
max-cache-ttl 1800

# pinentry-program is deliberately unset: the compiled-in default is the
# pinentry next to the gpg binary, which for the Homebrew formula is
# $(brew --prefix)/bin/pinentry. For a native macOS dialog:
#   brew install pinentry-mac
#   pinentry-program /opt/homebrew/bin/pinentry-mac

# enable-ssh-support is also unset. It makes gpg-agent replace ssh-agent,
# which only pays off when SSH keys live on a smart card, and it conflicts
# with the launchd ssh-agent and UseKeychain that macOS provides.
