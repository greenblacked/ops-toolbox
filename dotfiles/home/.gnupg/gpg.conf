# GnuPG - options for gpg itself. Long option names, no leading dashes.
#
# Based on drduh/config gpg.conf with every line checked against doc/gpg.texi
# of GnuPG 2.4. Options that were already the default are stated anyway,
# because "the default" changes between releases and a hardening file
# should not depend on which release reads it.

# Algorithm preferences, strongest first. gpg picks the first one every
# recipient supports, so the order is the policy.
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
# Digest used when certifying keys, and for passphrase-based symmetric
# encryption. The compiled-in default for s2k is still SHA-1.
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256

display-charset utf-8
# No Comment: or Version: header in armored output. They are unsigned, and
# they tell a reader which software produced the message.
no-comments
no-emit-version
no-greeting
# 16-hex-digit key IDs; the 8-digit short form is trivially collidable.
keyid-format 0xlong
with-fingerprint
list-options show-uid-validity
verify-options show-uid-validity
# Reject signing subkeys that lack a back-signature from the primary key.
require-cross-certification
# No passphrase cache for symmetric encryption.
no-symkey-cache
# ASCII output by default; binary .gpg files do not paste anywhere.
armor

# Keyserver: set in dirmngr.conf, not here. gpg 2.x ignores it in this file
# with a deprecation warning, and there is no default server since 2.5.3.
