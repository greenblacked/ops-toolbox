# kitty. Read from ~/.config/kitty/kitty.conf; reloads itself on save.
# Every option and default checked against kitty/options/definition.py of
# kitty 0.48.

# --- font ------------------------------------------------------------------
# `kitty +list-fonts` prints the exact family name for the installed build.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# Ligatures in prose, plain glyphs under the cursor while editing.
disable_ligatures cursor

# --- scrollback ------------------------------------------------------------
# Default 2000 is useless for kubectl logs or a terraform plan.
scrollback_lines 100000
# Extra history, in MB, only for the pager opened with kitty_mod+h.
scrollback_pager_history_size 64
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- clipboard -------------------------------------------------------------
# Select is copy. kitty's docs point out any app can then read the
# clipboard; the ask-on-read default below is what limits that.
copy_on_select clipboard
strip_trailing_spaces smart
# The default, stated: a program over ssh may write the clipboard but must
# ask to read it.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
# Confirm a paste that contains control characters; the class of bug this
# stops is "pasted text ran a command".
paste_actions quote-urls-at-prompt,confirm

# --- macOS -----------------------------------------------------------------
# Left Option is Alt for zsh and nvim; right Option still types € and ~.
macos_option_as_alt left
macos_quit_when_last_window_closed yes
macos_titlebar_color system

# --- bell ------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0
# Dock bounce when a long command in a background window finishes.
window_alert_on_bell yes
bell_on_tab "🔔 "

# --- tabs and windows ------------------------------------------------------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
window_padding_width 4
remember_window_size yes
# With shell integration, ask before closing only when a command is still
# running - a port-forward, a watch - and never for an idle prompt.
confirm_os_window_close -1
background_opacity 1.0

# --- shell integration and remote control ----------------------------------
# Prompt jumping, "show last command output", new tabs in the current dir.
shell_integration enabled
# Desktop notification when a command over 30s finishes in another window.
notify_on_cmd_finish unfocused 30
# `kitten @` from scripts over the socket only; a program on the TTY cannot
# drive the terminal.
allow_remote_control socket-only
listen_on unix:/tmp/kitty
allow_hyperlinks yes
detect_urls yes
url_style curly

# --- cursor ----------------------------------------------------------------
cursor_shape block
cursor_blink_interval 0
cursor_trail 3

# --- misc ------------------------------------------------------------------
# Homebrew keeps kitty current; no built-in update nag.
update_check_interval 0
# On a host without the kitty terminfo, use `kitten ssh host` instead of ssh.
term xterm-kitty
editor nvim

# --- keys ------------------------------------------------------------------
kitty_mod ctrl+shift
map cmd+t        new_tab_with_cwd
map cmd+enter    new_window_with_cwd
map cmd+k        combine : clear_terminal scrollback active : send_text normal,application \x0c
map cmd+f        show_scrollback
map kitty_mod+h  show_last_command_output
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4

# `kitten themes` writes this file; missing is fine.
include current-theme.conf
