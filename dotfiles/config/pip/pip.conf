# pip user settings. On Linux this is $XDG_CONFIG_HOME/pip/pip.conf. On
# macOS pip looks in ~/Library/Application Support/pip first and only falls
# back here if that directory does not exist, so never create it;
# `pip config debug` shows which file won. Keys are the long option names
# from src/pip/_internal/cli/cmdoptions.py.

[global]
# Refuse to install into the system or pyenv-global interpreter. The
# environment that breaks is then always one you can delete.
# Override once with PIP_REQUIRE_VIRTUALENV=false.
require-virtualenv = true
# No PyPI round-trip on every command to ask whether pip is current.
disable-pip-version-check = true
# Socket timeout, default 15. A slow mirror is not a failed install.
timeout = 60
